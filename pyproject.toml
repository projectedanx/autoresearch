[project]
name = "autoresearch"
version = "0.1.0"
description = "Autonomous pretraining research swarm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kernels~=0.16.0",
    "matplotlib~=3.10.8",
    "numpy~=2.5.1",
    "pandas~=3.0.3",
    "pyarrow~=24.0.0",
    "pytest~=9.0.3",
    "pytest-cov~=7.1.0",
    "requests~=2.34.2",
    "rustbpe~=0.1.0",
    "tiktoken~=0.13.0",
    "torch==2.10.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
